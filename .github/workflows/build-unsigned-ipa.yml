name: Build Unsigned IPA

# يطلع ملف IPA بدون توقيع. ينفع للاختبار/التخزين،
# بس ما ينثبّت على iPhone عادي بدون توقيع صالح.
on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - '**.mm'
      - 'CMakeLists.txt'
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Configure (iOS device, unsigned)
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_REQUIRED=NO

      - name: Build app
        run: |
          xcodebuild -project build/ShadowArchitect.xcodeproj \
            -scheme ShadowArchitect \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build -type d -name ShadowArchitect.app | head -n 1)
          test -n "$APP" && test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -q -r ShadowArchitect-unsigned.ipa Payload)
          ls -lh build/ipa/ShadowArchitect-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowArchitect-unsigned-IPA
          path: build/ipa/ShadowArchitect-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
